name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full Tree Depth)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate Machine-Readable Core Files
        run: |
          test -f sitemap.xml || (echo "Missing sitemap.xml" && exit 1)
          test -f robots.txt || (echo "Missing robots.txt" && exit 1)
          test -f dataset.json || (echo "Missing dataset.json" && exit 1)
          test -f openapi.json || (echo "Missing openapi.json" && exit 1)
          python3 -c "import json; json.load(open('dataset.json'))"
          python3 -c "import json; json.load(open('openapi.json'))"
          echo "All core machine-readable schemas validated."

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
